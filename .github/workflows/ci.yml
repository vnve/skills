name: Skill and standalone CLI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:skill
      - run: pnpm test
      - run: pnpm test:install
      - uses: actions/upload-artifact@v4
        with:
          name: vnve-${{ runner.os }}-${{ runner.arch }}
          path: dist/vnve-*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: vnve-*
          merge-multiple: true
          path: dist
      - name: Check release version and attachments
        id: metadata
        run: |
          node --input-type=module <<'JS'
          import { appendFile, readFile, readdir } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const cli = JSON.parse(await readFile('skills/vnve/cli.json', 'utf8'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(cli.version) || pkg.version !== cli.version || cli.releaseTag !== `cli-v${cli.version}`)
            throw new Error('Valid version and releaseTag must match package.json and cli.json');
          await appendFile(process.env.GITHUB_OUTPUT, `tag=${cli.releaseTag}\n`);
          const manifests = (await readdir('dist')).filter(name => name.endsWith('.json'));
          if (manifests.length !== 3) throw new Error('Expected three native platform builds');
          const targets = new Set();
          for (const name of manifests) {
            const build = JSON.parse(await readFile(`dist/${name}`, 'utf8'));
            if (build.version !== cli.version || build.apiVersion !== cli.apiVersion || !cli.targets.includes(build.target) || targets.has(build.target))
              throw new Error(`Invalid release build: ${name}`);
            targets.add(build.target);
          }
          JS
          cd dist
          sha256sum --check vnve-*.sha256
      - name: Publish unreleased version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: bash scripts/publish-release.sh
