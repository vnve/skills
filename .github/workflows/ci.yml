name: Skill and standalone CLI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:skill
      - run: pnpm test
      - run: pnpm test:install
      - uses: actions/upload-artifact@v4
        with:
          name: vnve-${{ runner.os }}-${{ runner.arch }}
          path: dist/vnve-*
